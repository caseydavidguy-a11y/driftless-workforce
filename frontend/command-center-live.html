<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driftless Workforce | Recruiting Command Center</title>
</head>
<body>
<div id="loader" style="font-family:system-ui;padding:24px">Loading Command Center…</div>
<script>
(async function(){
  try {
    const source = await fetch('command-center.html?live='+Date.now(), {cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('Command Center source returned '+r.status); return r.text(); });
    const urls=['../data/command_center_refresh.js','../data/command_center_refresh_2026-08-27.js','../data/command_center_refresh_2026-08-29.js','../data/command_center_refresh_2026-08-29_employer_universe.js','../data/command_center_employer_census_2026-08-29.js'];
    const codes=await Promise.all(urls.map(u=>fetch(u+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error('Data source returned '+r.status+': '+u); return r.text();})));
    for(const code of codes){const s=document.createElement('script');s.textContent=code;document.head.appendChild(s);}
    const doc=new DOMParser().parseFromString(source,'text/html');
    document.title=doc.title||document.title;
    document.head.insertAdjacentHTML('beforeend',Array.from(doc.head.querySelectorAll('style')).map(s=>s.outerHTML).join('\n'));
    document.body.innerHTML=doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi,'')||'<div id="root"></div>';
    if(!document.getElementById('root')) document.body.insertAdjacentHTML('beforeend','<div id="root"></div>');
    function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));document.head.appendChild(s);});}
    await load('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js');
    await load('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js');
    await load('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js');
    const babelScript=Array.from(doc.querySelectorAll('script')).find(s=>s.type==='text/babel');
    if(!babelScript) throw new Error('Command Center application script not found');
    let appSource=babelScript.textContent;
    appSource=appSource.replace('const SEED=[','const SEED=[...(window.DRIFTLESS_REFRESH||[]),...(window.DRIFTLESS_REFRESH_0827||[]),...(window.DRIFTLESS_REFRESH_0829||[]),...(window.DRIFTLESS_EMPLOYER_UNIVERSE_0829||[]),...(window.DRIFTLESS_EMPLOYER_CENSUS_0829||[]),');
    appSource=appSource.replace('function score(e){return FACTORS.reduce((n,[k,,m])=>n+Math.min(m,e[k]||0),0)}','function score(e){const w=window.__DRIFTLESS_WEIGHTS||Object.fromEntries(FACTORS.map(([k,,m])=>[k,m]));const total=Object.values(w).reduce((a,b)=>a+b,0)||1;return Math.round(FACTORS.reduce((n,[k,,m])=>n+(Math.min(m,e[k]||0)/m)*(Number(w[k])||0),0)/total*100)}');
    appSource=appSource.replace("function App(){const[sel,setSel]=useState(0),[q,setQ]=useState('');const rows=useMemo", "function App(){const[sel,setSel]=useState(0),[q,setQ]=useState('');const defaults=Object.fromEntries(FACTORS.map(([k,,m])=>[k,m]));const[weights,setWeights]=useState(()=>{try{const s=JSON.parse(localStorage.getItem('driftless-score-weights')||'null');return s&&typeof s==='object'?{...defaults,...s}:defaults}catch(e){return defaults}});window.__DRIFTLESS_WEIGHTS=weights;const updateWeight=(k,v)=>{const next={...weights,[k]:Number(v)};setWeights(next);window.__DRIFTLESS_WEIGHTS=next;localStorage.setItem('driftless-score-weights',JSON.stringify(next))};const resetWeights=()=>{setWeights(defaults);window.__DRIFTLESS_WEIGHTS=defaults;localStorage.setItem('driftless-score-weights',JSON.stringify(defaults))};const completeRefresh=()=>{localStorage.setItem('driftless-score-weights',JSON.stringify(weights));window.location.href=window.location.pathname+'?refresh='+Date.now()};const rows=useMemo",1);
    appSource=appSource.replace('], [q])','], [q,weights])');
    appSource=appSource.replace('<main className="body">','<section style={{maxWidth:1250,margin:"0 auto",padding:"18px 32px 0"}}><div className="notice" style={{marginBottom:0}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:16,flexWrap:"wrap"}}><div><b>Search controls</b><div className="small">Adjust what matters to you. Rankings recalculate immediately; your settings stay saved on this device.</div></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button onClick={resetWeights} style={{border:"1px solid #dedacd",background:"#fff",borderRadius:8,padding:"8px 11px",cursor:"pointer"}}>Reset scores</button><button onClick={completeRefresh} style={{border:"1px solid #232019",background:"#232019",color:"#fff",borderRadius:8,padding:"8px 11px",cursor:"pointer"}}>Complete Refresh</button></div></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"10px 18px",marginTop:14}}>{FACTORS.map(([k,l,m])=><label key={k} style={{fontSize:12,color:"#5c564a"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span>{l}</span><b>{weights[k]}</b></div><input type="range" min="0" max="30" step="1" value={weights[k]} onChange={e=>updateWeight(k,e.target.value)} style={{width:"100%"}}/></label>)}</div></div></section><main className="body">');
    const transformed=Babel.transform(appSource,{presets:['react']}).code;
    new Function('React','ReactDOM',transformed)(window.React,window.ReactDOM);
  } catch(err) {
    document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>Command Center could not load</h2><p>'+String(err.message||err)+'</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
