<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Driftless Workforce | Recruiting Command Center</title></head><body><div id="loader" style="font-family:system-ui;padding:24px">Loading Command Center…</div><script>(async function(){try{const source=await fetch('command-center.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Command Center source returned '+r.status);return r.text()});const urls=['../data/command_center_refresh.js','../data/command_center_refresh_2026-08-27.js','../data/command_center_refresh_2026-08-29.js','../data/command_center_refresh_2026-08-29_employer_universe.js','../data/command_center_employer_census_2026-08-29.js'];const codes=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Data source returned '+r.status+': '+u);return r.text()})));for(const code of codes){const s=document.createElement('script');s.textContent=code;document.head.appendChild(s)}const doc=new DOMParser().parseFromString(source,'text/html');document.title=doc.title||document.title;document.head.insertAdjacentHTML('beforeend',Array.from(doc.head.querySelectorAll('style')).map(s=>s.outerHTML).join('\n'));document.body.innerHTML=doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi,'')||'<div id="root"></div>';if(!document.getElementById('root'))document.body.insertAdjacentHTML('beforeend','<div id="root"></div>');function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('Failed to load '+src));document.head.appendChild(s)})}await load('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js');await load('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js');await load('https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js');const babelScript=Array.from(doc.querySelectorAll('script')).find(s=>s.type==='text/babel');if(!babelScript)throw Error('Command Center application script not found');let appSource=babelScript.textContent;appSource=appSource.replace('const SEED=[','const SEED=[...(window.DRIFTLESS_REFRESH||[]),...(window.DRIFTLESS_REFRESH_0827||[]),...(window.DRIFTLESS_REFRESH_0829||[]),...(window.DRIFTLESS_EMPLOYER_UNIVERSE_0829||[]),...(window.DRIFTLESS_EMPLOYER_CENSUS_0829||[]),');appSource=appSource.replace(/const FACTORS=\[[\s\S]*?\];/,'const FACTOR_DEFAULTS=[[\'volume\',\'Hiring volume\',20],[\'persistence\',\'Hiring persistence\',15],[\'difficulty\',\'Recruiting difficulty\',20],[\'leadership\',\'Leadership need\',15],[\'fit\',\'Driftless fit\',15],[\'access\',\'Employer accessibility\',10],[\'signal\',\'Opportunity signal\',5]];const FACTORS=(()=>{try{const saved=JSON.parse(localStorage.getItem(\'driftless_score_weights\')||\'null\');return FACTOR_DEFAULTS.map(([k,l,d])=>[k,l,Number.isFinite(saved?.[k])?saved[k]:d])}catch(e){return FACTOR_DEFAULTS}})();');const transformed=Babel.transform(appSource,{presets:['react']}).code;new Function('React','ReactDOM',transformed)(window.React,window.ReactDOM);setTimeout(addControls,400);function addControls(){if(document.getElementById('score-controls'))return;const box=document.createElement('aside');box.id='score-controls';box.style.cssText='position:fixed;right:16px;bottom:16px;width:310px;max-height:78vh;overflow:auto;background:#fffdf8;border:1px solid #d8d1c3;border-radius:16px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.18);z-index:9999;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:#232019';const saved=JSON.parse(localStorage.getItem('driftless_score_weights')||'null')||{volume:20,persistence:15,difficulty:20,leadership:15,fit:15,access:10,signal:5};box.innerHTML='<div style="font-weight:800;font-size:16px">Command Center Controls</div><div style="font-size:11px;color:#766f61;margin:4px 0 12px">Adjust ranking weights. Apply to re-rank the employer universe.</div><div id="weights"></div><div style="display:flex;gap:7px;margin-top:12px"><button id="applyScores" style="flex:1;border:0;border-radius:9px;padding:9px;background:#232019;color:#fff;font-weight:700">Apply & Re-rank</button><button id="resetScores" style="border:1px solid #d8d1c3;border-radius:9px;padding:9px;background:#fff">Reset</button></div><button id="refreshData" style="width:100%;margin-top:7px;border:1px solid #bdb5a6;border-radius:9px;padding:9px;background:#eeeae0;font-weight:700">↻ Refresh Command Center Data</button><div style="font-size:10px;color:#8a8172;margin-top:8px">Preferences are saved on this device and survive refreshes.</div>';const labels={volume:'Hiring volume',persistence:'Hiring persistence',difficulty:'Recruiting difficulty',leadership:'Leadership need',fit:'Driftless fit',access:'Employer accessibility',signal:'Opportunity signal'};const w=box.querySelector('#weights');Object.entries(labels).forEach(([k,l])=>{const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center;margin:8px 0';row.innerHTML='<label style="font-size:11px">'+l+'<input data-k="'+k+'" type="range" min="0" max="100" value="'+(saved[k]??0)+'" style="width:100%"></label><input data-n="'+k+'" type="number" min="0" max="100" value="'+(saved[k]??0)+'" style="width:48px;border:1px solid #d8d1c3;border-radius:6px;padding:4px">';w.appendChild(row)});box.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>box.querySelector('input[data-n="'+r.dataset.k+'"]').value=r.value);box.querySelectorAll('input[type=number]').forEach(n=>n.oninput=()=>box.querySelector('input[data-k="'+n.dataset.n+'"]').value=n.value);box.querySelector('#applyScores').onclick=()=>{const out={};box.querySelectorAll('input[data-n]').forEach(n=>out[n.dataset.n]=Math.max(0,Math.min(100,Number(n.value)||0)));localStorage.setItem('driftless_score_weights',JSON.stringify(out));location.reload()};box.querySelector('#resetScores').onclick=()=>{localStorage.removeItem('driftless_score_weights');location.reload()};box.querySelector('#refreshData').onclick=()=>{location.reload()};document.body.appendChild(box)}}catch(err){document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>Command Center could not load</h2><p>'+String(err.message||err)+'</p></div>';console.error(err)}})();</script></body></html>
