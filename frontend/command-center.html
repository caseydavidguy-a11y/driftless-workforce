<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driftless Workforce | Recruiting Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f2ed;color:#232019}button,input,select{font:inherit}.page{min-height:100vh}.header{background:#161a15;color:#ede8dd;padding:36px 32px 26px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#9aa89a}.h1{font-size:34px;margin:8px 0;font-weight:800}.sub{color:#b7bdb2;margin:0 0 24px}.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{background:#1f241d;border-radius:12px;padding:13px 18px;min-width:120px}.kl{font-size:10px;letter-spacing:1px;color:#8b958a;font-weight:700}.kv{font-size:28px;font-weight:800;margin-top:5px}.body{display:flex;gap:22px;max-width:1200px;margin:auto;padding:26px 32px 60px;flex-wrap:wrap}.left{flex:1 1 390px}.right{flex:1 1 450px;background:#fff;border:1px solid #e4dfd3;border-radius:16px;padding:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.label{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#6b6355}.search{border:1px solid #dedacd;border-radius:8px;padding:8px 10px;width:190px;background:#fff}.card{background:#fff;border:1px solid #e4dfd3;border-radius:12px;padding:15px;margin-bottom:9px;cursor:pointer}.active{border-color:#232019;box-shadow:0 2px 10px rgba(0,0,0,.06)}.cardtop{display:flex;gap:10px;align-items:flex-start}.rank{width:20px;color:#b7af9c;font-weight:800}.name{font-size:16px;font-weight:700}.meta{font-size:12px;color:#847c6c;margin-top:3px}.score{text-align:right;font-size:22px;font-weight:800}.pill{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:3px 7px;border-radius:6px;margin-top:4px}.detailhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detailname{font-size:26px;font-weight:800;margin:4px 0 0}.badge{color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px;white-space:nowrap}.section{margin-top:22px}.st{font-size:11px;font-weight:700;letter-spacing:1.2px;color:#9a927e;text-transform:uppercase;margin-bottom:9px}.jobs{margin:0;padding-left:18px}.jobs li{margin-bottom:6px;font-size:14px}.bar{display:flex;gap:9px;align-items:center;margin-bottom:8px}.bl{width:135px;font-size:12px;color:#5c564a}.track{flex:1;height:8px;background:#eeeae0;border-radius:5px;overflow:hidden}.fill{height:100%;background:#232019}.bv{width:38px;text-align:right;font-size:12px;color:#8b8474}.muted{font-size:13.5px;line-height:1.55;color:#7a7364}.notice{background:#fff;border:1px solid #e4dfd3;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#6b6355}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const FACTORS=[['volume','Hiring volume',20],['persistence','Hiring persistence',15],['difficulty','Recruiting difficulty',20],['leadership','Leadership need',15],['fit','Driftless fit',15],['access','Employer accessibility',10],['signal','Opportunity signal',5]];
const EXCLUDED=['teacher','teaching','cashier','retail associate','sales associate','beauty advisor','child care','daycare','patient care','medical assistant','nurse','lpn','rn','pharmacy sales','merchandiser','barista','server','crew member','dishwasher','waiter','waitress'];
function inScope(j){const t=String(j.title||'').toLowerCase();if(EXCLUDED.some(x=>t.includes(x)))return false;const i=String(j.industry||'').toLowerCase();return /manufacturing|warehouse|operations|skilled trades|hospitality|leadership/.test(i)||/production|assembler|fabrication|warehouse|shipping|receiving|material|inventory|maintenance|technician|mechanic|electrician|hvac|welder|machinist|operations manager|operations supervisor|operations director|restaurant manager|hotel manager|food service manager|manager|supervisor|director|leadership|chief/.test(t)}
function csv(text){const out=[];for(const line of text.trim().split(/\r?\n/).slice(1)){let a=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'&&line[i+1]==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){a.push(c);c='';continue}c+=x}a.push(c);if(a[1])out.push({employer:a[0],title:a[1],location:a[2],industry:a[3],posted_at:a[4],source_url:a[6]})}return out.filter(inScope)}
function build(jobs){const g={};jobs.forEach(j=>(g[j.employer]??=[]).push(j));return Object.entries(g).map(([name,items],idx)=>{const leaders=items.filter(j=>/manager|supervisor|director|lead|chief/i.test(j.title)).length;const f={volume:Math.min(20,items.length*4),persistence:Math.min(15,items.length*2),difficulty:Math.min(20,items.length*3),leadership:Math.min(15,leaders*5),fit:15,access:6,signal:Math.min(5,items.length)};return{id:idx,name,industry:[...new Set(items.map(j=>j.industry).filter(Boolean))].join(' / ')||'Focused industry',openings:items.map(j=>j.title),location:[...new Set(items.map(j=>j.location).filter(Boolean))].join(' · '),...f}})}
function score(e){return FACTORS.reduce((n,[k,,max])=>n+Math.min(max,e[k]||0),0)}
function tier(s){return s>=85?['PURSUE NOW','#b0472e']:s>=65?['MONITOR','#8a6d2f']:['LOW PRIORITY','#5b6660']}
function App(){const[emps,setEmps]=useState([]);const[selected,setSelected]=useState(null);const[q,setQ]=useState('');const[live,setLive]=useState(false);useEffect(()=>{fetch('../data/current_jobs.csv?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const e=build(csv(t));if(e.length){setEmps(e);setSelected(e[0].id);setLive(true)}}).catch(()=>{})},[]);const rows=useMemo(()=>emps.map(e=>({...e,total:score(e)})).filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.total-a.total),[emps,q]);const active=rows.find(e=>e.id===selected)||rows[0];const pursue=rows.filter(e=>e.total>=85).length;const monitor=rows.filter(e=>e.total>=65&&e.total<85).length;return <div className="page"><header className="header"><div className="eyebrow">DRIFTLESS WORKFORCE GROUP</div><div className="h1">Recruiting Command Center</div><p className="sub">Focused employer opportunity scoring for the La Crosse & Driftless region</p><div className="kpis"><div className="kpi"><div className="kl">EMPLOYERS TRACKED</div><div className="kv">{rows.length}</div></div><div className="kpi"><div className="kl">PURSUE NOW</div><div className="kv" style={{color:'#b0472e'}}>{pursue}</div></div><div className="kpi"><div className="kl">MONITOR</div><div className="kv" style={{color:'#8a6d2f'}}>{monitor}</div></div><div className="kpi"><div className="kl">OPEN JOBS</div><div className="kv">{rows.reduce((n,e)=>n+e.openings.length,0)}</div></div></div></header><main className="body"><section className="left"><div className="toolbar"><span className="label">EMPLOYER PIPELINE</span><input className="search" placeholder="Search employers…" value={q} onChange={e=>setQ(e.target.value)}/></div><div className="notice">{live?'Live focused-industry intelligence loaded.':'Waiting for the latest intelligence refresh.'} Teaching, cashier, generic retail and other excluded roles are blocked.</div>{rows.map((e,i)=>{const[t,c]=tier(e.total);return <div key={e.id} className={'card '+(active?.id===e.id?'active':'')} onClick={()=>setSelected(e.id)}><div className="cardtop"><div className="rank">{i+1}</div><div style={{flex:1}}><div className="name">{e.name}</div><div className="meta">{e.industry}</div></div><div><div className="score">{e.total}</div><div className="pill" style={{background:c}}>{t}</div></div></div></div>})}</section><section className="right">{active&&<><div className="detailhead"><div><div className="meta">{active.industry}</div><div className="detailname">{active.name}</div></div><div className="badge" style={{background:tier(active.total)[1]}}>{active.total}/100 — {tier(active.total)[0]}</div></div><div className="section"><div className="st">Open positions</div><ul className="jobs">{active.openings.map((x,i)=><li key={i}>{x}</li>)}</ul></div><div className="section"><div className="st">Score breakdown</div>{FACTORS.map(([k,l,m])=><div className="bar" key={k}><span className="bl">{l}</span><span className="track"><span className="fill" style={{display:'block',width:((active[k]||0)/m*100)+'%'}}/></span><span className="bv">{active[k]||0}/{m}</span></div>)}</div><div className="section"><div className="st">Recommended approach</div><p className="muted">Focused-industry recruiting outreach based on current local hiring demand.</p></div><div className="section"><div className="st">Evidence</div><p className="muted">{active.openings.length} in-scope opening{active.openings.length===1?'':'s'} currently represented in the live intelligence feed.</p></div><div className="section"><div className="st">Location</div><p className="muted">{active.location||'La Crosse / Driftless region'}</p></div></>}</section></main></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
