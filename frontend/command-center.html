function score(e){return FACTORS.reduce((n,[k,,m])=>n+Math.min(m,e[k]||0),0)}function tier(s){return s>=85?['PURSUE NOW','#b0472e']:s>=65?['MONITOR','#8a6d2f']:['LOW PRIORITY','#5b6660']}
function App(){const[sel,setSel]=useState(0),[q,setQ]=useState('');const rows=useMemo(()=>SEED.map((e,i)=>({...e,id:i,total:score(e)})).filter(e=>(e.name+' '+e.industry).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.total-a.total),[q]);const active=rows.find(e=>e.id===sel)||rows[0];const jobs=rows.reduce((n,e)=>n+e.jobs.length,0),pursue=rows.filter(e=>e.total>=85).length,monitor=rows.filter(e=>e.total>=65&&e.total<85).length;return <div className="page"><header className="header"><div className="eyebrow">DRIFTLESS WORKFORCE GROUP</div><div className="h1">Recruiting Command Center</div><p className="sub">Employer opportunity scoring for the La Crosse & Driftless region</p><div className="kpis"><div className="kpi"><div className="kl">EMPLOYERS TRACKED</div><div className="kv">{rows.length}</div></div><div className="kpi"><div className="kl">PURSUE NOW</div><div className="kv" style={{color:'#b0472e'}}>{pursue}</div></div><div className="kpi"><div className="kl">MONITOR</div><div className="kv" style={{color:'#8a6d2f'}}>{monitor}</div></div><div className="kpi"><div className="kl">VERIFIED JOB POSTINGS</div><div className="kv">{jobs}</div></div></div></header><main className="body"><section className="left"><div className="toolbar"><span className="label">EMPLOYER PIPELINE</span><input className="search" placeholder="Search employers or industry…" value={q} onChange={e=>setQ(e.target.value)}/></div><div className="notice"><b>Scope locked:</b> manufacturing, warehouse/distribution, operations, skilled trades, industrial engineering, food/beverage production, transportation and leadership. Teaching, cashier, generic retail and medical roles are excluded.</div>{rows.map((e,i)=>{const[t,c]=tier(e.total);return <div key={e.id} className={'card '+(active?.id===e.id?'active':'')} onClick={()=>setSel(e.id)}><div className="cardtop"><div className="rank">{i+1}</div><div style={{flex:1}}><div className="name">{e.name}</div><div className="meta">{e.industry} • {e.location}</div></div><div><div className="score">{e.total}</div><div className="pill" style={{background:c}}>{t}</div></div></div></div>})}</section><section className="right">{active&&<><div className="detailhead"><div><div className="meta">{active.industry}</div><div className="detailname">{active.name}</div><div className="small">Last verified: August 25, 2026</div></div><div className="badge" style={{background:tier(active.total)[1]}}>{active.total}/100 — {tier(active.total)[0]}</div></div><div className="section"><div className="st">Actual job postings</div><ul className="jobs">{active.jobs.length?active.jobs.map((j,i)=><li key={i}><b>{j[0]}</b><span className="jobmeta">{j[1]} • {j[2]} • Posted/verified {j[3]}</span><a className="joblink" href={j[4]} target="_blank">View source / apply ↗</a></li>):<li>No current verified posting captured yet; employer remains tracked for outreach and refresh.</li>}</ul></div><div className="section"><div className="st">Employer contacts</div><div className="contact"><div><b>Contact:</b> {active.contact}</div>{active.phone&&<div><b>Phone:</b> {active.phone}</div>}{active.email&&<div><b>Email:</b> <a href={'mailto:'+active.email}>{active.email}</a></div>}<div><b>Facility:</b> {active.address}</div>{active.careers&&<div><b>Careers:</b> <a href={active.careers} target="_blank">Open careers page ↗</a></div>}</div></div><div className="section"><div className="st">Score breakdown</div>{FACTORS.map(([k,l,m])=><div className="bar" key={k}><span className="bl">{l}</span><span className="track"><span className="fill" style={{display:'block',width:((active[k]||0)/m*100)+'%'}}/></span><span className="bv">{active[k]||0}/{m}</span></div>)}</div><div className="section"><div className="st">Recommended approach</div><p className="muted">Lead with the verified local openings, then use the public recruiting/HR contact to ask about additional unposted demand, shift gaps, and hard-to-fill roles.</p><div className="chips"><span className="chip">Local employer</span><span className="chip">Focused industry</span>{active.jobs.length>0&&<span className="chip">Active postings</span>}<span className="chip">Contact target</span></div></div><div className="section"><div className="st">Source</div><p className="source">Public employer career pages, Job Center of Wisconsin, and public business/contact listings. Posting status should be re-verified before outreach.</p></div></>}</section></main></div>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
