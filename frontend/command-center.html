<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Driftless Workforce | Recruiting Command Center</title><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f2ed;color:#232019}button,input{font:inherit}.page{min-height:100vh}.header{background:#161a15;color:#ede8dd;padding:36px 32px 26px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#9aa89a}.h1{font-size:34px;margin:8px 0;font-weight:800}.sub{color:#b7bdb2;margin:0 0 24px}.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{background:#1f241d;border-radius:12px;padding:13px 18px;min-width:120px}.kl{font-size:10px;letter-spacing:1px;color:#8b958a;font-weight:700}.kv{font-size:28px;font-weight:800;margin-top:5px}.body{display:flex;gap:22px;max-width:1200px;margin:auto;padding:26px 32px 60px;flex-wrap:wrap}.left{flex:1 1 390px}.right{flex:1 1 450px;background:#fff;border:1px solid #e4dfd3;border-radius:16px;padding:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.label{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#6b6355}.search{border:1px solid #dedacd;border-radius:8px;padding:8px 10px;width:190px;background:#fff}.card{background:#fff;border:1px solid #e4dfd3;border-radius:12px;padding:15px;margin-bottom:9px;cursor:pointer}.active{border-color:#232019;box-shadow:0 2px 10px rgba(0,0,0,.06)}.cardtop{display:flex;gap:10px;align-items:flex-start}.rank{width:20px;color:#b7af9c;font-weight:800}.name{font-size:16px;font-weight:700}.meta{font-size:12px;color:#847c6c;margin-top:3px}.score{text-align:right;font-size:22px;font-weight:800}.pill{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:3px 7px;border-radius:6px;margin-top:4px}.detailhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detailname{font-size:26px;font-weight:800;margin:4px 0 0}.badge{color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px;white-space:nowrap}.section{margin-top:22px}.st{font-size:11px;font-weight:700;letter-spacing:1.2px;color:#9a927e;text-transform:uppercase;margin-bottom:9px}.jobs{margin:0;padding-left:18px}.jobs li{margin-bottom:6px;font-size:14px}.bar{display:flex;gap:9px;align-items:center;margin-bottom:8px}.bl{width:135px;font-size:12px;color:#5c564a}.track{flex:1;height:8px;background:#eeeae0;border-radius:5px;overflow:hidden}.fill{height:100%;background:#232019}.bv{width:38px;text-align:right;font-size:12px;color:#8b8474}.muted{font-size:13.5px;line-height:1.55;color:#7a7364}.notice{background:#fff;border:1px solid #e4dfd3;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#6b6355}</style></head>
<body><div id="root"></div><script type="text/babel">
const {useState,useMemo}=React;
const FACTORS=[['volume','Hiring volume',20],['persistence','Hiring persistence',15],['difficulty','Recruiting difficulty',20],['leadership','Leadership need',15],['fit','Driftless fit',15],['access','Employer accessibility',10],['signal','Opportunity signal',5]];
const SEED=[
{name:'Wis-Pak',industry:'Beverage Manufacturing',openings:['Production (3rd Shift) La Crosse, WI','Quality Assurance Lab Technician (3rd Shift) - La Crosse, WI'],location:'La Crosse, WI',volume:18,persistence:13,difficulty:17,leadership:4,fit:15,access:7,signal:5},
{name:'Performance Foodservice',industry:'Foodservice / Warehouse & Distribution',openings:['Warehouse Order Selector','Entry-Level Truck Driver','Fleet Maintenance Manager'],location:'La Crosse, WI',volume:20,persistence:14,difficulty:18,leadership:12,fit:15,access:7,signal:5},
{name:'Inland Packaging',industry:'Manufacturing / Packaging / Logistics',openings:['Part-Time Manufacturing Associate – Multiple Shifts Available','Logistics Coordinator'],location:'La Crosse, WI',volume:16,persistence:12,difficulty:17,leadership:7,fit:15,access:8,signal:5},
{name:'Trane Technologies',industry:'Manufacturing / HVAC',openings:['Assembly','Senior Manufacturing Engineer-Welding','Senior Support Engineer'],location:'La Crosse, WI',volume:18,persistence:12,difficulty:18,leadership:14,fit:15,access:8,signal:5},
{name:'Great Lakes Cheese',industry:'Food & Beverage Manufacturing',openings:['1st Shift Maintenance Inventory Specialist','2nd Shift Grinder Helper'],location:'La Crosse, WI',volume:15,persistence:12,difficulty:18,leadership:6,fit:15,access:7,signal:4},
{name:'Ace Hardware Distribution Center',industry:'Warehouse & Distribution',openings:['Warehouse Specialist','Forklift Operator'],location:'La Crosse, WI',volume:12,persistence:8,difficulty:12,leadership:4,fit:13,access:8,signal:3},
{name:'Kwik Trip Distribution/Kitchens',industry:'Warehouse & Distribution',openings:['Kitchens Warehouse Material Handler (2nd Shift)'],location:'La Crosse, WI',volume:10,persistence:9,difficulty:11,leadership:2,fit:13,access:6,signal:3},
{name:'Wisconsin Packaging Corp / Inland',industry:'Manufacturing / Packaging',openings:['Manufacturing / Production openings'],location:'La Crosse, WI',volume:10,persistence:8,difficulty:12,leadership:4,fit:13,access:6,signal:3},
];
function score(e){return FACTORS.reduce((n,[k,,m])=>n+Math.min(m,e[k]||0),0)}function tier(s){return s>=85?['PURSUE NOW','#b0472e']:s>=65?['MONITOR','#8a6d2f']:['LOW PRIORITY','#5b6660']}
function App(){const[sel,setSel]=useState(0);const[q,setQ]=useState('');const rows=useMemo(()=>SEED.map((e,i)=>({...e,id:i,total:score(e)})).filter(e=>e.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.total-a.total),[q]);const active=rows.find(e=>e.id===sel)||rows[0];const pursue=rows.filter(e=>e.total>=85).length;const monitor=rows.filter(e=>e.total>=65&&e.total<85).length;return <div className="page"><header className="header"><div className="eyebrow">DRIFTLESS WORKFORCE GROUP</div><div className="h1">Recruiting Command Center</div><p className="sub">Employer opportunity scoring for the La Crosse & Driftless region</p><div className="kpis"><div className="kpi"><div className="kl">EMPLOYERS TRACKED</div><div className="kv">{rows.length}</div></div><div className="kpi"><div className="kl">PURSUE NOW</div><div className="kv" style={{color:'#b0472e'}}>{pursue}</div></div><div className="kpi"><div className="kl">MONITOR</div><div className="kv" style={{color:'#8a6d2f'}}>{monitor}</div></div><div className="kpi"><div className="kl">OPEN JOBS</div><div className="kv">{rows.reduce((n,e)=>n+e.openings.length,0)}</div></div></div></header><main className="body"><section className="left"><div className="toolbar"><span className="label">EMPLOYER PIPELINE</span><input className="search" placeholder="Search employers…" value={q} onChange={e=>setQ(e.target.value)}/></div><div className="notice">Known local job postings restored to the Command Center, including Wis-Pak, Performance Foodservice, Inland Packaging, Trane Technologies, Great Lakes Cheese, and distribution employers.</div>{rows.map((e,i)=>{const[t,c]=tier(e.total);return <div key={e.id} className={'card '+(active?.id===e.id?'active':'')} onClick={()=>setSel(e.id)}><div className="cardtop"><div className="rank">{i+1}</div><div style={{flex:1}}><div className="name">{e.name}</div><div className="meta">{e.industry}</div></div><div><div className="score">{e.total}</div><div className="pill" style={{background:c}}>{t}</div></div></div></div>})}</section><section className="right">{active&&<><div className="detailhead"><div><div className="meta">{active.industry}</div><div className="detailname">{active.name}</div></div><div className="badge" style={{background:tier(active.total)[1]}}>{active.total}/100 — {tier(active.total)[0]}</div></div><div className="section"><div className="st">Open positions</div><ul className="jobs">{active.openings.map((x,i)=><li key={i}>{x}</li>)}</ul></div><div className="section"><div className="st">Score breakdown</div>{FACTORS.map(([k,l,m])=><div className="bar" key={k}><span className="bl">{l}</span><span className="track"><span className="fill" style={{display:'block',width:((active[k]||0)/m*100)+'%'}}/></span><span className="bv">{active[k]||0}/{m}</span></div>)}</div><div className="section"><div className="st">Recommended approach</div><p className="muted">Prioritize employer outreach around the active local openings shown above.</p></div><div className="section"><div className="st">Evidence</div><p className="muted">{active.openings.length} known posting{active.openings.length===1?'':'s'} represented for this employer.</p></div><div className="section"><div className="st">Location</div><p className="muted">{active.location}</p></div></>}</section></main></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
