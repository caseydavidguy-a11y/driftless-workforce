<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driftless Workforce | AI Scout</title>
<style>body{margin:0;background:#f4f2ed;color:#232019;font-family:system-ui,-apple-system,sans-serif}header{background:#161a15;color:#ede8dd;padding:28px 24px}h1{margin:0 0 6px;font-size:28px}.sub{color:#b7bdb2}main{max-width:1100px;margin:auto;padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{padding:9px 11px;border:1px solid #dedacd;border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:white;border:1px solid #e4dfd3;border-radius:12px;padding:17px}.top{display:flex;justify-content:space-between;gap:10px}.score{font-size:24px;font-weight:800}.pill{font-size:10px;padding:4px 7px;border-radius:6px;background:#5b6660;color:white}.meta{font-size:12px;color:#847c6c;margin:4px 0 12px}.label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#9a927e;font-weight:700;margin-top:12px}.small{font-size:13px;line-height:1.5}.evidence{color:#6f685b}</style></head>
<body><header><div style="font-size:11px;letter-spacing:2px;font-weight:700;color:#9aa89a">DRIFTLESS WORKFORCE GROUP</div><h1>AI Scout — Prospect Queue</h1><div class="sub">Qualified employer opportunities generated from current employer intelligence.</div></header>
<main><div class="toolbar"><input id="q" placeholder="Search employer, industry, location…" style="flex:1;min-width:240px"><select id="priority"><option value="">All priorities</option><option>Pursue</option><option>Monitor</option><option>Low</option></select><select id="min"><option value="0">Any score</option><option value="30">30+</option><option value="40">40+</option><option value="50">50+</option></select></div><div id="summary" style="margin-bottom:14px;color:#6b6355;font-size:13px"></div><div id="grid" class="grid"></div></main>
<script>
let data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('priority').value,min=Number(document.getElementById('min').value);const rows=data.filter(x=>(!q||[x.employer,...x.industries,...x.locations,...x.target_roles].join(' ').toLowerCase().includes(q))&&(!p||x.priority===p)&&x.score>=min);document.getElementById('summary').textContent=rows.length+' prospect(s) · Scout does not fabricate contacts; Hunter adds only verified decision-makers.';document.getElementById('grid').innerHTML=rows.map(x=>'<article class="card"><div class="top"><div><b>'+esc(x.employer)+'</b><div class="meta">'+esc(x.locations.join(', '))+' · '+esc(x.industries.join(', '))+'</div></div><div style="text-align:right"><div class="score">'+x.score+'</div><span class="pill">'+esc(x.priority)+'</span></div></div><div class="small"><b>'+x.opening_count+'</b> opening(s), <b>'+x.verified_opening_count+'</b> verified</div><div class="label">Target roles</div><div class="small">'+esc(x.target_roles.join(', ')||'—')+'</div><div class="label">Decision-maker path</div><div class="small">'+esc(x.decision_maker_roles.join(', ')||'—')+'</div><div class="label">Outreach angle</div><div class="small">'+esc(x.outreach_angle||'—')+'</div><div class="label">Evidence</div><div class="small evidence">'+esc((x.evidence||[]).join(' · ')||'—')+'</div></article>').join('')||'<div>No prospects match those filters.</div>'}
fetch('../data/prospect_queue.json').then(r=>r.json()).then(x=>{data=x;render()}).catch(e=>{document.getElementById('grid').textContent='Could not load Scout queue: '+e.message});['q','priority','min'].forEach(id=>document.getElementById(id).addEventListener('input',render));
</script></body></html>
