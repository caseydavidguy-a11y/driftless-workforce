name: Intelligence Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect_jobcenter.py
      - run: python scripts/validate_outputs.py
      - name: Commit generated intelligence
        run: |
          git config user.name 'driftless-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'Refresh employer intelligence'
          git push
