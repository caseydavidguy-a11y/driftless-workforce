name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Compile API
        run: python -m py_compile server/main.py
      - name: Validate production outputs
        run: python scripts/validate_outputs.py
      - name: Check browser JavaScript syntax
        run: |
          for file in frontend/*.js; do node --check "$file"; done
