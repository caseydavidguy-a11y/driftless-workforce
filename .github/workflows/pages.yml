name: Deploy Driftless Workforce Command Center

# Deployment smoke test: push-triggered Pages deployment.
# Pages visibility is enabled; this run verifies the live deploy path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build publishable site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data
          cp -R frontend/. site/
          for file in employer_opportunities.json snapshot_history.json change_report.json signals.json contact_research.json current_jobs.csv; do
            test -f "data/$file"
            cp "data/$file" "site/data/$file"
          done
          test -f site/index.html
          test -f site/styles.css
          touch site/.nojekyll
          echo "Publish tree:"
          find site -maxdepth 2 -type f | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
