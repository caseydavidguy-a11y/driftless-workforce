name: Deploy Driftless Workforce website

# Publishes the public website (website/out). The internal command center now lives in Claude and is no longer published here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Redeploy when the published frontend changes; this marker also makes deployment recovery auditable.

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build the public website
        shell: bash
        run: |
          set -euo pipefail
          python3 website/build.py
          test -f website/out/index.html
          test -f website/out/retainer.html
          echo "Publish tree:"
          find website/out -maxdepth 2 -type f | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
