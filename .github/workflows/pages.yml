name: Deploy Driftless Workforce Command Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build publishable site
        run: |
          rm -rf site
          mkdir -p site/data
          cp frontend/* site/
          cp data/employer_opportunities.json site/data/
          cp data/snapshot_history.json site/data/
          cp data/change_report.json site/data/
          cp data/signals.json site/data/
          cp data/contact_research.json site/data/
          cp data/current_jobs.csv site/data/
          touch site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
