name: Deploy Driftless Workforce Command Center

# Deploy the internal recruiting command center from the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build publishable site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data
          cp -R frontend/. site/
          # Publish every data layer used by the live Command Center.
          cp -R data/. site/data/
          test -f site/index.html
          test -f site/command-center-live.html
          test -f site/command-center.html
          touch site/.nojekyll
          echo "Publish tree:"
          find site -maxdepth 2 -type f | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
