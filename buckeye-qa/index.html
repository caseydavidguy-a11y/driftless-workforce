<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Buckeye QA Checker</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f5f5f5;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}textarea{width:100%;min-height:180px;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}button{padding:12px 18px;border:0;border-radius:8px;font-weight:700;background:#171717;color:#fff}.check{padding:12px 0;border-bottom:1px solid #eee}.ok{color:#16723b}.warn{color:#996800}.bad{color:#a51d2d}.muted{color:#666}</style></head><body><h1>Project Buckeye — QA Checker</h1><p class="muted">Pre-submission QA based only on the Buckeye training material supplied for this project.</p><div class="card"><h2>Prompt</h2><textarea id="p" placeholder="Paste your prompt here..."></textarea></div><div class="card"><h2>Rubric</h2><textarea id="r" placeholder="Paste your rubric here..."></textarea></div><div class="card"><h2>Environment notes</h2><textarea id="e" placeholder="Optional: paste file names or relevant extracted text. Always review the actual environment documents."></textarea></div><button onclick="go()">CHECK MY WORK</button><div id="out" class="card" style="display:none"><h2>QA Report</h2><div id="s"></div><div id="c"></div><p class="muted"><b>Important:</b> Warnings require human review. This checker does not invent Buckeye rules or write the task for you.</p></div><script>const W=s=>(s.match(/\b[\w’'-]+\b/g)||[]).length,A=(s,x)=>x.some(v=>s.toLowerCase().includes(v));function go(){let p=document.getElementById('p').value.trim(),r=document.getElementById('r').value.trim(),e=document.getElementById('e').value.trim(),w=W(p),a=[];function q(n,z,m){a.push('<div class="check"><b class="'+z+'">'+z.toUpperCase()+' — '+n+'</b><br>'+m+'</div>')}q('Prompt length',w>=300&&w<=500?'ok':'bad',w+' words — training requires 300–500 words.');q('Unambiguous',A(p,['based on','using','must','required','calculate','produce','deliver','rank'])?'ok':'warn','Check that the prompt distinguishes model failure from prompt failure.');q('Professional role & context',A(p,['you are','manager','director','supervisor','coordinator','analyst'])?'ok':'warn','Verify persona, audience, stakes and context are specific.');q('Realistic, not contrived',A(p,['company','department','client','employee','vendor','operations','hr','customer','project'])?'ok':'warn','Verify the scenario mirrors professional work.');q('Timeless / anchored date',A(p,['as of','2025','2026','january','february','march','april','may','june','july','august','september','october','november','december'])?'ok':'warn','If time matters, anchor a date inside the scenario.');q('Clear deliverable',A(p,['deliver','produce','create','submit','memo','report','plan','brief','docx','xlsx','pdf','filename'])?'ok':'warn','Verify format, filename, audience and quality bar.');q('Clear constraints',A(p,['must not','do not','only','no more than','maximum','within','limit','constraint'])?'ok':'warn','Verify important must-nots and resource limits.');q('Closed-world solvability','warn',e?'Review whether every substantive requirement is supported by the supplied environment.':'Review the actual environment and verify the task is solvable from it alone.');q('Solution path not given away',A(p,['step 1','step 2','first','then','next','use this formula'])?'warn':'ok','Review whether the prompt prescribes the solution path.');q('Meaningful failure mechanism',A(p,['conflict','reconcile','precedence','exception','threshold','duplicate','missing','discrep','cross-reference','sequential'])?'ok':'warn','Training examples emphasize meaningful failure from reconciliation, sequence, termination, reverse-solving, messy data, thresholds, and baseline/policy separation.');q('Rubric supplied',r?'ok':'bad',r?'Rubric supplied.':'Paste the rubric before submission.');if(r){let l=r.split(/\n+/).filter(Boolean);q('Atomic criteria',l.every(x=>(x.match(/\band\b/gi)||[]).length<=1)?'ok':'warn','Criteria should be simple declarative true/false statements, not stacked requirements.');q('Objective / checkable',A(r,['sufficiently detailed','sound professional judgment','good','appropriate','reasonable'])?'warn':'ok','Avoid subjective standards.');q('Self-contained',A(r,['project charter','see attached','refer to','according to the environment'])?'warn':'ok','Criteria should be self-contained.');q('Negative criteria',A(r,['does not','fails to','omits','incorrect','hallucinates','unreconciled','ignores','misses'])?'ok':'warn','Negative criteria should describe the presence of an undesirable behavior.')}document.getElementById('out').style.display='block';document.getElementById('s').innerHTML='<p><b>Prompt:</b> '+w+' words &nbsp; <b>Rubric:</b> '+(r?'supplied':'missing')+'</p>';document.getElementById('c').innerHTML=a.join('');}</script></body></html>
